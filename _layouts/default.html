<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | National Teleprompter</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <link rel="canonical" href="https://nationalteleprompter.com{{ page.url }}">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WDK620VM5B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WDK620VM5B');
    </script>

    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
             line-height:1.7;color:#1a1a1a;background:#fff}
        .wrap{max-width:820px;margin:0 auto;padding:0 20px}
        header{background:#12263f;padding:18px 0}
        header a{color:#fff;text-decoration:none;font-weight:700;font-size:1.05rem}
        header nav a{font-weight:400;font-size:.95rem;margin-left:18px;opacity:.85}
        main{padding:36px 0 56px}
        h1{font-size:2rem;line-height:1.25;margin:0 0 1rem}
        h2{font-size:1.4rem;margin:2rem 0 .75rem}
        h3{font-size:1.15rem;margin:1.5rem 0 .5rem}
        p,li{font-size:1.02rem}
        img{max-width:100%;height:auto}
        table{width:100%;border-collapse:collapse;margin:1.25rem 0;display:block;overflow-x:auto}
        th,td{border:1px solid #d8dee6;padding:8px 10px;text-align:left}
        hr{border:0;border-top:1px solid #e3e8ee;margin:2rem 0}
        a{color:#0b5cab}
        footer{border-top:1px solid #e3e8ee;padding:24px 0 40px;font-size:.9rem;color:#5a6572}
        @media (max-width:600px){h1{font-size:1.6rem}header nav a{margin-left:10px}}
    </style>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0B0D10">
<style id="ntn-brand">
:root{
--accent:#00E5FD;--accent-dim:#00B9CC;--accent-ink:#04202A;
--steel:#F2F4F7;--steel-light:rgba(242,244,247,.64);--gunmetal:rgba(242,244,247,.42);--text-bright:#F2F4F7;
--gold:#00E5FD;--gold-light:#7CF1FF;--gold-dark:#00E5FD;
--bg-main:#0B0D10;--bg-void:#0B0D10;--bg-dark:#0B0D10;--dark:#0B0D10;--darker:#07090B;
--bg-section:#12161B;--bg-card:#12161B;--bg-elevated:#171C22;--bg-deep:#07090B;
--bg-card-hover:#171C22;--bg-glass:rgba(255,255,255,.03);
--text-primary:#F2F4F7;--text:#F2F4F7;--text-secondary:rgba(242,244,247,.64);
--text-muted:rgba(242,244,247,.42);--gray:rgba(242,244,247,.64);--light-gray:rgba(242,244,247,.42);
--border-subtle:rgba(255,255,255,.08);--border-gold:rgba(255,255,255,.08);--border-active:#00E5FD;
--spot-gold:rgba(0,229,253,.14);--spot-orange:rgba(0,229,253,.10);
--sunset-orange:#00C9E0;--sunset-red:#00B9CC;
--font-display:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
--font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
html,body{background:#0B0D10;color:#F2F4F7}
h1,h2,h3,h4{color:var(--text-primary)}
a{color:#00E5FD}
.header,header.header{background:rgba(11,13,16,.9);border-bottom:1px solid rgba(255,255,255,.05);box-shadow:none}
.logo-img{height:38px;width:auto;max-width:none}
.nav-links a{color:rgba(242,244,247,.64)}
.nav-links a:hover{color:#F2F4F7}
.nav-phone,.header-phone{color:#00E5FD}
.nav-cta,.cta-button,.btn-primary,button[type=submit],input[type=submit]{background:#00E5FD;color:#04202A;border-color:#00E5FD}
.nav-cta:hover,.cta-button:hover,.btn-primary:hover{background:#7CF1FF;color:#04202A}
.cta-box,.card,.service-card,.testimonial-card,.product-card{background:#12161B;border:1px solid rgba(255,255,255,.08);box-shadow:none}
.article-header{background:#12161B}
.article-content h1,.article-content h2,.article-content h3,.article-content h4{color:#F2F4F7}
.article-content p,.article-content li{color:rgba(242,244,247,.64)}
.footer,footer.footer,footer{background:#0B0D10;border-top:1px solid rgba(255,255,255,.05)}
.footer p,footer p{color:rgba(242,244,247,.42)}
.footer a,footer a{color:rgba(242,244,247,.42)}
.footer a:hover,footer a:hover{color:#00E5FD}
input,textarea,select{background:#12161B;color:#F2F4F7;border:1px solid rgba(255,255,255,.08)}
input::placeholder,textarea::placeholder{color:rgba(242,244,247,.42)}
hr{border-color:rgba(255,255,255,.08)}
</style>
</head>
<body>
    <header><div class="wrap">
        <a href="/">National Teleprompter</a>
        <nav style="display:inline"><a href="/">Home</a><a href="/blog.html">Blog</a><a href="/about.html">About</a></nav>
    </div></header>
    <main><div class="wrap">
{{ content }}
    </div></main>
    <footer><div class="wrap">&copy; 2026 National Teleprompter &middot; <a href="/">nationalteleprompter.com</a></div></footer>
</body>
</html>
